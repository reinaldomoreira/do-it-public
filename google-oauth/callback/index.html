<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>do-it · Connect Google</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background-color: #0b1020;
      color: #e8ecf5;
      padding: 16px;
    }
    .card {
      width: min(92vw, 440px);
      padding: 32px 28px;
      background-color: #131a2e;
      border: 1px solid #243049;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
      color: #e8ecf5;
    }
    .logo span {
      color: #4c7dff;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0 0 12px;
      color: #e8ecf5;
    }
    p {
      color: #aeb8cc;
      margin: 0 0 20px;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 20px;
      background-color: #4c7dff;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 10px;
      border: 0;
      cursor: pointer;
    }
    .helper {
      font-size: 0.85rem;
      color: #8a96ad;
      margin-top: 16px;
      margin-bottom: 0;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main class="card" id="card">
    <div class="logo">do<span>-</span>it</div>
    <div id="content">
      <h1 id="title">Returning to do-it...</h1>
      <p id="description">Finishing your Google connection.</p>
      <a id="action-btn" class="btn hidden" href="#">Open do-it</a>
      <p id="helper-text" class="helper hidden">If do-it didn't open, make sure the app is installed on this device, then tap the button above.</p>
    </div>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var titleEl = document.getElementById('title');
      var descEl = document.getElementById('description');
      var btnEl = document.getElementById('action-btn');
      var helperEl = document.getElementById('helper-text');

      // Forward only what the app reads; the app validates `state` and exchanges `code` itself.
      var forward = new URLSearchParams();
      ['code', 'state', 'error'].forEach(function (key) {
        var value = params.get(key);
        if (value) forward.set(key, value);
      });

      if (!forward.get('state') || (!forward.get('code') && !forward.get('error'))) {
        if (titleEl) titleEl.textContent = 'Invalid Request';
        if (descEl) descEl.textContent = 'No authorization result was found. Please connect Google from the do-it app settings.';
        return;
      }

      var targetUrl = 'doit://google-oauth?' + forward.toString();
      if (forward.get('error')) {
        if (titleEl) titleEl.textContent = 'Google Connection Cancelled';
        if (descEl) descEl.textContent = 'The connection was cancelled or failed. Return to do-it to try again.';
      }
      if (btnEl) {
        btnEl.setAttribute('href', targetUrl);
        btnEl.classList.remove('hidden');
      }
      if (helperEl) helperEl.classList.remove('hidden');

      try {
        window.location.href = targetUrl;
      } catch (e) {
        // The button above is the fallback.
      }
    })();
  </script>
</body>
</html>
